<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoutePulse India</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.top{background:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd}.brand{font-size:22px;font-weight:bold;color:#1769e8}.wrap{max-width:1000px;margin:auto;padding:24px}.hero{background:#1769e8;color:white;padding:28px;border-radius:16px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.card{background:#fff;padding:20px;border-radius:14px;border:1px solid #ddd}.btn{padding:11px 16px;border:0;border-radius:9px;background:#1769e8;color:#fff;font-weight:bold;cursor:pointer}.btn2{background:#edf4ff;color:#1769e8}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px;color:#64748b}.field input,.field select{width:100%;padding:11px;border:1px solid #ccd6e3;border-radius:8px;box-sizing:border-box}.nav{margin:3px;padding:9px;border:0;border-radius:8px;background:#eef4ff;color:#1769e8;cursor:pointer}.map{height:330px;background:#dcebd8;border-radius:12px;position:relative;overflow:hidden}.bus{position:absolute;left:45%;top:45%;font-size:32px;transition:1s}.road{position:absolute;left:-10%;top:130px;width:120%;height:100px;background:#fff;border:5px solid #cbd5c4;border-radius:60px;transform:rotate(-8deg)}.pill{padding:5px 8px;border-radius:20px;background:#dcfce7;color:#16803f;font-size:12px;font-weight:bold}.row{padding:13px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.muted{color:#718096;font-size:13px}@media(max-width:700px){.cards{grid-template-columns:1fr}.top{padding:12px}.wrap{padding:14px}}</style></head><body><div id="app"></div><script>
const KEY='rp_orgs';let orgs=JSON.parse(localStorage.getItem(KEY)||'null')||[{name:'Greenfield School',code:'GREEN12',email:'admin@greenfield.in',buses:[{id:'GF-101',reg:'DL01AB1234',route:'School Route A'}]}];let org=null;
function save(){localStorage.setItem(KEY,JSON.stringify(orgs))}function top(){return '<div class="top"><div class="brand">🚌 RoutePulse India</div><div><button class="nav" onclick="home()">Home</button><button class="nav" onclick="admin()">Admin</button><button class="nav" onclick="passenger()">Passenger</button><button class="nav" onclick="gov()">🇮🇳 Government</button></div></div>'}function home(){document.getElementById('app').innerHTML=top()+'<main class="wrap"><div class="hero"><h1>Real-Time Bus Tracking for India</h1><p>Private organisation buses stay private. Passengers see only buses belonging to their organisation.</p></div><div class="cards"><div class="card"><h2>🏢 Organisation Admin</h2><p>Create an organisation and add its buses.</p><button class="btn" onclick="admin()">Open Admin</button></div><div class="card"><h2>👤 Passenger</h2><p>Enter your organisation code to track its buses.</p><button class="btn btn2" onclick="passenger()">Open Passenger</button></div></div></main>'}
function admin(){document.getElementById('app').innerHTML=top()+'<main class="wrap"><div class="cards"><div class="card"><h2>Create Admin</h2><div class="field"><label>ORGANISATION</label><input id="n" placeholder="School / Company"></div><div class="field"><label>ADMIN EMAIL</label><input id="e" placeholder="admin@example.in"></div><button class="btn" onclick="create()">Create</button></div><div class="card"><h2>Admin Login</h2><div class="field"><label>ORGANISATION CODE</label><input id="c" placeholder="GREEN12"></div><div class="field"><label>EMAIL</label><input id="le" placeholder="admin@greenfield.in"></div><button class="btn" onclick="login()">Login</button></div></div><div class="card" style="margin-top:18px"><h3>Demo codes</h3>'+orgs.map(o=>'<div class="row"><b>'+o.name+'</b><span class="pill">'+o.code+'</span></div>').join('')+'</div></main>'}
function create(){let n=document.getElementById('n').value.trim(),e=document.getElementById('e').value.trim();if(!n||!e)return alert('Enter organisation and email');let code=(n.replace(/[^A-Za-z]/g,'').slice(0,5).toUpperCase()||'ORG')+Math.floor(10+Math.random()*90);org={name:n,email:e,code,buses:[]};orgs.push(org);save();alert('Created. Organisation code: '+code);dashboard()}
function login(){let c=document.getElementById('c').value.trim().toUpperCase(),e=document.getElementById('le').value.trim().toLowerCase();org=orgs.find(x=>x.code===c&&x.email.toLowerCase()===e);if(!org)return alert('Wrong code or email');dashboard()}
function dashboard(){document.getElementById('app').innerHTML=top()+'<main class="wrap"><div class="card"><h2>'+org.name+'</h2><p class="muted">Private Admin • Code: <b>'+org.code+'</b></p><button class="btn" onclick="addBus()">＋ Add Bus</button></div><div class="cards"><div class="card"><h3>My Buses</h3>'+(org.buses.length?org.buses.map(b=>'<div class="row"><div><b>'+b.id+'</b><div class="muted">'+b.reg+' • '+b.route+'</div></div><span class="pill">LIVE</span></div>').join(''):'<p class="muted">No buses added yet.</p>')+'</div><div class="card"><h3>Live Map</h3><div class="map"><div class="road"></div><div class="bus" id="bus">🚌</div></div></div></div></main>';move()}
function addBus(){document.getElementById('app').innerHTML=top()+'<main class="wrap"><div class="card"><h2>Add Bus to '+org.name+'</h2><div class="field"><label>BUS ID</label><input id="bi" placeholder="BUS-001"></div><div class="field"><label>REGISTRATION</label><input id="br" placeholder="DL01AB1234"></div><div class="field"><label>ROUTE</label><input id="bo" placeholder="Route A"></div><button class="btn" onclick="add()">Add Bus</button></div></main>'}function add(){let b={id:document.getElementById('bi').value.trim(),reg:document.getElementById('br').value.trim(),route:document.getElementById('bo').value.trim()};if(!b.id||!b.reg||!b.route)return alert('Fill all fields');org.buses.push(b);save();dashboard()}
function passenger(){document.getElementById('app').innerHTML=top()+'<main class="wrap"><div class="card"><h2>Passenger Access</h2><p class="muted">You must have your organisation code.</p><div class="field"><label>ORGANISATION CODE</label><input id="pc" placeholder="GREEN12"></div><button class="btn" onclick="pLogin()">Track My Bus</button></div></main>'}function pLogin(){let c=document.getElementById('pc').value.trim().toUpperCase();org=orgs.find(x=>x.code===c);if(!org)return alert('Organisation code not found');pDash()}function pDash(){document.getElementById('app').innerHTML=top()+'<main class="wrap"><div class="hero"><h1>'+org.name+'</h1><p>Only this organisation\'s buses are visible.</p></div><div class="cards"><div class="card"><h3>Select bus</h3>'+(org.buses.length?org.buses.map(x=>'<div class="row"><div><b>'+x.id+'</b><div class="muted">'+x.reg+' • '+x.route+'</div></div><span class="pill">LIVE</span></div>').join(''):'<p>No buses have been added by this organisation.</p>')+'</div><div class="card"><h3>Live location / ETA</h3><div class="map"><div class="road"></div><div class="bus" id="bus">🚌</div></div><h2>ETA: 8 min</h2><p class="muted">Distance to selected stop: 3.4 km</p></div></div><div class="card" style="margin-top:18px"><h3>Stops</h3><div class="row">📍 Stop A <span>3 min • 1.2 km</span></div><div class="row">📍 Stop B <span>7 min • 2.5 km</span></div><div class="row">📍 Stop C <span>12 min • 4.1 km</span></div></div></main>';move()}
function gov(){document.getElementById('app').innerHTML=top()+'<main class="wrap"><div class="hero"><h1>🇮🇳 Government Buses</h1><p>Separate public transport section.</p></div><div class="card" style="margin-top:18px"><h3>Live government data</h3><p>Real-time positions are shown here only when an official/authorised transport feed is connected. This demo does not invent government GPS data.</p><div class="row"><b>Delhi Government Bus Feed</b><span class="pill">FEED READY</span></div><div class="row"><b>Haryana Roadways Feed</b><span class="pill">FEED READY</span></div><div class="row"><b>Other State Transport Feeds</b><span class="pill">FEED READY</span></div></div></main>'}
function move(){let x=0;setInterval(()=>{let b=document.getElementById('bus');if(!b)return;x=(x+4)%80;b.style.left=x+'%';},800)}home();
</script></body></html>
